services:

  backend:
    build:
      context: ./backend
    container_name: articlehub-backend
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_USER: articlehub_user
      DB_PASSWORD: articlehub_pass_2026
      DB_NAME: my_db
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: articlehub-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend