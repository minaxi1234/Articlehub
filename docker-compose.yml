services:

  backend:
    image: meenakshisunil/articlehub-backend:latest

    container_name: articlehub-backend

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 5000

    ports:
      - "5000:5000"

    networks:
      - articlehub-network

  frontend:
    image: meenakshisunil/articlehub-frontend:latest

    container_name: articlehub-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - articlehub-network

networks:
  articlehub-network:
    driver: bridge